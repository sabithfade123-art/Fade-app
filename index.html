<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lord Fade Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #00f2ff; text-align: center; margin: 0; padding: 20px; }
        .card { border: 2px solid #00f2ff; border-radius: 20px; padding: 40px 20px; box-shadow: 0 0 20px #00f2ff55; margin-top: 50px; }
        h1 { font-size: 2.5rem; text-transform: uppercase; letter-spacing: 4px; margin-bottom: 10px; }
        p { color: #888; font-size: 1.1rem; }
        .btn { background: #00f2ff; color: #000; border: none; padding: 15px 30px; border-radius: 10px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 30px; width: 100%; }
    </style>
</head>
<body>
    <div class="card">
        <h1>LORD FADE</h1>
        <p>Official Telegram Mini App</p>
        <div style="font-size: 50px; margin: 20px 0;">⚡</div>
        <button class="btn" onclick="Telegram.WebApp.close()">EXIT HUB</button>
    </div>
    <script>
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
    </script>
</body>
</html>
